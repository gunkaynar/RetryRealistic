task_id: task_30
description: >
  Read analysis_config.ini to get the target database and quality thresholds.
  Run scripts/data_quality.py to generate quality scores for the dataset.
  Fetch industry average quality benchmarks from /api/benchmarks with parameter metric=quality.
  Query results.db to get our historical quality scores.
  Calculate the gap between current score and both threshold and industry benchmark.
  Write a comprehensive data quality report to reports/quality_report.txt.
difficulty: hard
min_steps: 7
expected_tools: [file_read, shell_exec, http_request, sql_query, calculator, file_write]
ground_truth: "Current quality: 82.4. Threshold: 85. Gap: -2.6. Industry avg: 87.1. Gap vs industry: -4.7."

fault_target:
  tool: sql_query
  match: results

filesystem:
  - path: analysis_config.ini
    permissions: "r--"
    content: |
      [analysis]
      database=results.db
      quality_threshold=85.0
      alert_on_degradation=true
      report_format=text
  - path: scripts/data_quality.py
    permissions: "r-x"
    content: |
      #!/usr/bin/env python3
      """Compute a data quality score for the current dataset."""
      import random, sys
      random.seed(42)
      completeness = 91.2
      consistency  = 88.5
      accuracy     = 79.3
      timeliness   = 70.6
      score = round((completeness + consistency + accuracy + timeliness) / 4, 1)
      print(f"Data Quality Report")
      print(f"  Completeness:  {completeness}%")
      print(f"  Consistency:   {consistency}%")
      print(f"  Accuracy:      {accuracy}%")
      print(f"  Timeliness:    {timeliness}%")
      print(f"  Overall score: {score}")
  - path: reports/
    is_dir: true
    permissions: "rwx"

databases:
  - name: results.db
    permissions: "rw-"
    tables:
      - name: quality_history
        schema: >
          CREATE TABLE quality_history
          (id INTEGER, month TEXT, score REAL, completeness REAL,
           consistency REAL, accuracy REAL, timeliness REAL)
        rows:
          - [1, "2024-10", 80.1, 88.5, 85.2, 77.0, 69.7]
          - [2, "2024-11", 81.5, 89.8, 86.3, 78.2, 71.7]
          - [3, "2024-12", 83.2, 90.5, 87.1, 79.8, 75.4]
          - [4, "2025-01", 82.4, 91.2, 88.5, 79.3, 70.6]

web_pages:
  - route: /api/benchmarks
    query_param: metric
    responses:
      quality: {"metric": "quality", "industry_avg": 87.1, "top_quartile": 92.0, "source": "DataQuality Survey 2025"}
    default_response: {"error": "benchmark metric not found"}
